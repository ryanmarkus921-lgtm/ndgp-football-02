<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#050608">

  <!-- iPhone / Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >
  <meta
    name="apple-mobile-web-app-title"
    content="NDGP Football"
  >

  <!-- Browser / Search -->
  <meta
    name="description"
    content="NDGP Football — Notre Dame Green Pond Football"
  >

  <title>NDGP Football</title>

  <!-- APP ICON -->
  <link
    rel="icon"
    type="image/png"
    href="app-icon.png"
  >

  <link
    rel="apple-touch-icon"
    href="app-icon.png"
  >

  <!-- PWA -->
  <link
    rel="manifest"
    href="manifest.webmanifest"
  >

  <!-- Main App Styles -->
  <link
    rel="stylesheet"
    href="styles.css"
  >
</head>

<body>

  <div class="app-shell">

    <!-- =========================
         HEADER
    ========================== -->

    <header class="topbar">

      <div class="brand">

        <img
          src="LOGO_W__FB.png"
          alt="NDGP Football"
          class="brand-logo"
        >

        <div class="brand-text">

          <div class="brand-kicker">
            NOTRE DAME GREEN POND
          </div>

          <h1>
            NDGP Football
          </h1>

        </div>

      </div>

    </header>


    <!-- =========================
         MAIN APP
    ========================== -->

    <main
      id="app"
      class="page"
    >

      <!-- HOME -->

      <section
        id="home-page"
        class="view active"
      ></section>


      <!-- SCHEDULE -->

      <section
        id="schedule-page"
        class="view"
      ></section>


      <!-- ROSTER -->

      <section
        id="roster-page"
        class="view"
      ></section>


      <!-- HISTORY -->

      <section
        id="history-page"
        class="view"
      ></section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="site-footer">

      <div class="socials">

        <a
          href="https://www.instagram.com/ndgp_fb_scores/"
          target="_blank"
          rel="noopener noreferrer"
        >
          Instagram
        </a>

        <span>•</span>

        <a
          href="https://x.com/ndgp_fb_score"
          target="_blank"
          rel="noopener noreferrer"
        >
          X
        </a>

      </div>

      <div>
        Managed by NDGP Football Scores
      </div>

    </footer>


    <!-- =========================
         FLOATING NAVIGATION
    ========================== -->

    <nav
      class="floating-nav"
      aria-label="Primary navigation"
    >

      <button
        class="nav-item active home"
        data-page="home"
        aria-label="Home"
      >
        <span>HOME</span>
      </button>


      <button
        class="nav-item schedule"
        data-page="schedule"
        aria-label="Schedule"
      >
        <span>SCHEDULE</span>
      </button>


      <button
        class="nav-item roster"
        data-page="roster"
        aria-label="Roster"
      >
        <span>ROSTER</span>
      </button>


      <button
        class="nav-item history"
        data-page="history"
        aria-label="History"
      >
        <span>HISTORY</span>
      </button>

    </nav>

  </div>


  <!-- =========================
       SUPABASE
  ========================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>


  <!-- =========================
       APP JAVASCRIPT
  ========================== -->

  <script src="app.js"></script>

</body>
</html>
